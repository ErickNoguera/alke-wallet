<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Menú principal de RappiWallet: saldo y accesos a depositar, enviar dinero y últimos movimientos." />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/styles.css" />
    <title>RappiWallet | Menú principal</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
          <a class="navbar-brand fw-bold" href="menu.html">RappiWallet</a>
          <button type="button" id="btn-cerrar-sesion" class="btn btn-outline-light btn-sm">
            Cerrar sesión
          </button>
        </div>
      </nav>
    </header>

    <main class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-sm mb-4">
            <div class="card-body text-center p-4">
              <p class="text-secondary mb-1">Saldo disponible</p>
              <p class="display-6 fw-bold mb-0" id="saldo">$0,00</p>
            </div>
          </div>

          <div class="d-grid gap-3">
            <button type="button" id="btn-depositar" class="btn btn-primary btn-lg">
              Depositar
            </button>
            <button type="button" id="btn-enviar" class="btn btn-primary btn-lg">
              Enviar dinero
            </button>
            <button type="button" id="btn-movimientos" class="btn btn-primary btn-lg">
              Últimos movimientos
            </button>
          </div>

          <p id="leyenda" class="text-center text-primary fw-semibold mt-3" aria-live="polite"></p>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../JS/storage.js"></script>
    <script src="../JS/menu.js"></script>
  </body>
</html>
