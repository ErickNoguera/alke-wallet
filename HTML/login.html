<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inicio de sesión de RappiWallet." />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/styles.css" />
    <title>RappiWallet | Iniciar sesión</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-dark bg-primary">
        <div class="container">
          <a class="navbar-brand fw-bold" href="index.html">RappiWallet</a>
        </div>
      </nav>
    </header>

    <main class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h4 text-center mb-3">Iniciar sesión</h1>

              <div id="alert-container" aria-live="polite"></div>

              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="demo@wallet.com"
                    autocomplete="username"
                  />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="••••"
                    autocomplete="current-password"
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
              </form>

              <p class="text-secondary small text-center mt-3 mb-0">
                Credencial de prueba: <strong>demo@wallet.com</strong> / <strong>1234</strong>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../JS/storage.js"></script>
    <script src="../JS/login.js"></script>
  </body>
</html>
