<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Enviar dinero a un contacto con RappiWallet." />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/styles.css" />
    <title>RappiWallet | Enviar dinero</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
          <a class="navbar-brand fw-bold" href="menu.html">RappiWallet</a>
          <a href="menu.html" class="btn btn-outline-light btn-sm">Volver al menú</a>
        </div>
      </nav>
    </header>

    <main class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <h1 class="h4 mb-1">Enviar dinero</h1>
          <p class="text-secondary">Saldo disponible: <strong id="saldo-actual">$0,00</strong></p>

          <!-- Búsqueda en la agenda -->
          <form id="form-busqueda" class="mb-3" role="search">
            <div class="input-group">
              <input
                type="search"
                class="form-control"
                id="busqueda"
                placeholder="Buscar por nombre o alias…"
                aria-label="Buscar contacto"
              />
              <button type="submit" class="btn btn-outline-primary">Buscar</button>
            </div>
          </form>

          <!-- Alta de contacto -->
          <button type="button" id="btn-agregar-contacto" class="btn btn-primary btn-sm mb-3">
            + Agregar nuevo contacto
          </button>

          <div id="form-nuevo-contacto" class="card mb-3" style="display: none;">
            <div class="card-body">
              <h2 class="h6">Nuevo contacto</h2>
              <div id="nc-alert" aria-live="polite"></div>
              <form id="formNuevoContacto" novalidate>
                <div class="mb-2">
                  <label for="nc-nombre" class="form-label">Nombre</label>
                  <input type="text" class="form-control" id="nc-nombre" />
                </div>
                <div class="mb-2">
                  <label for="nc-alias" class="form-label">Alias</label>
                  <input type="text" class="form-control" id="nc-alias" />
                </div>
                <div class="mb-3">
                  <label for="nc-cbu" class="form-label">CBU (22 dígitos)</label>
                  <input type="text" class="form-control" id="nc-cbu" inputmode="numeric" maxlength="22" />
                </div>
                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-primary btn-sm">Guardar</button>
                  <button type="button" id="btn-cancelar-contacto" class="btn btn-outline-secondary btn-sm">
                    Cancelar
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- Agenda -->
          <p class="text-secondary small mb-1">Seleccioná un contacto para enviarle dinero:</p>
          <ul id="lista-contactos" class="list-group mb-3"></ul>

          <!-- Panel de envío (visible al seleccionar un contacto) -->
          <div id="panel-envio" class="card" style="display: none;">
            <div class="card-body">
              <p class="mb-2">Enviar a <strong id="destinatario"></strong></p>
              <form id="formEnvio" novalidate>
                <div class="input-group mb-2">
                  <span class="input-group-text">$</span>
                  <input type="number" class="form-control" id="monto-envio" min="1" step="0.01" placeholder="0" />
                  <button type="submit" id="btn-enviar-dinero" class="btn btn-primary">Enviar dinero</button>
                </div>
              </form>
            </div>
          </div>

          <div id="confirmacion" class="mt-3" aria-live="polite"></div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../JS/storage.js"></script>
    <script src="../JS/sendmoney.js"></script>
  </body>
</html>
