<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Últimos movimientos de RappiWallet, con filtro por tipo." />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/styles.css" />
    <title>RappiWallet | Últimos movimientos</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
          <a class="navbar-brand fw-bold" href="menu.html">RappiWallet</a>
          <a href="menu.html" class="btn btn-outline-light btn-sm">Volver al menú</a>
        </div>
      </nav>
    </header>

    <main class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <h1 class="h4 mb-3">Últimos movimientos</h1>

          <form class="mb-3">
            <label for="filtro-tipo" class="form-label">Filtrar por tipo de movimiento</label>
            <select id="filtro-tipo" class="form-select">
              <option value="todos">Todos</option>
              <option value="compra">Compra</option>
              <option value="deposito">Depósito</option>
              <option value="transferencia_recibida">Transferencia recibida</option>
              <option value="envio">Envío</option>
            </select>
          </form>

          <ul id="lista-movimientos" class="list-group"></ul>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../JS/storage.js"></script>
    <script src="../JS/transactions.js"></script>
  </body>
</html>
