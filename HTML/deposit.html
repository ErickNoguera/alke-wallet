<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Depositar dinero en RappiWallet." />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/styles.css" />
    <title>RappiWallet | Depositar</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
          <a class="navbar-brand fw-bold" href="menu.html">RappiWallet</a>
          <a href="menu.html" class="btn btn-outline-light btn-sm">Volver al menú</a>
        </div>
      </nav>
    </header>

    <main class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h4 mb-3">Depositar</h1>

              <p class="text-secondary mb-1">Saldo actual</p>
              <p class="h5 fw-bold" id="saldo-actual">$0,00</p>

              <div id="alert-container" aria-live="polite"></div>

              <form id="depositForm" novalidate>
                <div class="mb-3">
                  <label for="monto" class="form-label">Monto a depositar</label>
                  <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input
                      type="number"
                      class="form-control"
                      id="monto"
                      min="1"
                      step="0.01"
                      placeholder="0"
                    />
                  </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Depositar</button>
              </form>

              <p id="leyenda-deposito" class="text-success fw-semibold mt-3 mb-0" style="display: none;"></p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../JS/storage.js"></script>
    <script src="../JS/deposit.js"></script>
  </body>
</html>
